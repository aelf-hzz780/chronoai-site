name: Deploy Quarto site to GitHub Pages

on:
  push:
    branches: [main, feature/approved-home-bilingual-seo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Build and verify the publication manifest
        id: publication
        run: |
          python -m pip install -r requirements.txt
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            export SITE_ORIGIN="https://${GITHUB_REPOSITORY_OWNER}.github.io"
            export SITE_BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
            python scripts/build.py --preview
            python tests/verify_site.py _preview
            echo "directory=_preview" >> "$GITHUB_OUTPUT"
          else
            python scripts/build.py
            python tests/verify_site.py
            echo "directory=_site" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.publication.outputs.directory }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
